name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            with_gd: "0"
            tag: latest
            version_prefix: ""
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            with_gd: "0"
            tag: arm
            version_prefix: "arm-"
          - runner: ubuntu-latest
            platform: linux/amd64
            with_gd: "1"
            tag: latest-gd
            version_prefix: "gd-"
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            with_gd: "1"
            tag: arm-gd
            version_prefix: "arm-gd-"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          echo "extra=$IMAGE:${{ matrix.tag }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=$IMAGE:${{ matrix.version_prefix }}${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            WITH_GD=${{ matrix.with_gd }}
          tags: |
            ${{ steps.tags.outputs.extra }}
            ${{ steps.tags.outputs.version }}
